services:
  - type: web
    runtime: node
    name: sky-ai-builder-api
    plan: free
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://sky-ai-builder.onrender.com
      - key: AI_PROVIDER
        value: openai
      - key: AI_REQUEST_TIMEOUT_MS
        value: "60000"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1

  - type: web
    runtime: static
    name: sky-ai-builder
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://sky-ai-builder-api.onrender.com
